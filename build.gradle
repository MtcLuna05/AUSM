plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.4.1'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id 'xyz.wagyourtail.unimined' version '1.4.18-kappa'
    id 'xyz.wagyourtail.jvmdowngrader' version '1.3.6'
    id 'net.kyori.blossom' version '2.2.0'
}

import org.jetbrains.gradle.ext.Gradle
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.nio.file.AtomicMoveNotSupportedException
import java.nio.file.Files
import java.nio.file.StandardCopyOption

apply from: 'gradle/scripts/helpers.gradle'

// Early Assertions
assertProperty 'mod_version'
assertProperty 'root_package'
assertProperty 'mod_id'
assertProperty 'mod_name'

assertSubProperties 'use_access_transformer', 'access_transformer_locations'
assertSubProperties 'is_coremod', 'coremod_includes_mod', 'coremod_plugin_class_name'

setDefaultProperty 'generate_sources_jar', true, false
setDefaultProperty 'generate_javadocs_jar', true, false
setDefaultProperty 'minecraft_username', true, 'Developer'
setDefaultProperty 'extra_jvm_args', false, ''
setDefaultProperty 'jbr_home', false, ''
setDefaultProperty 'enable_hotswap_helper', false, true
setDefaultProperty 'gpu_offload', false, ''

version = propertyString('mod_version')
group = propertyString('root_package')

base {
    archivesName = 'AUSM'
}

ext.resolvePreferredJavaHome = {
    String configuredHome = propertyString('jbr_home')
    List<File> candidates = []

    if (configuredHome != null && !configuredHome.trim().isEmpty()) {
        candidates << file(configuredHome.trim())
    }

    candidates << file('/usr/lib/jvm/java-25-openjdk')

    File selected = candidates.find { candidate ->
        File javaBin = new File(candidate, 'bin/java')
        File releaseFile = new File(candidate, 'release')
        if (!javaBin.isFile() || !javaBin.canExecute() || !releaseFile.isFile()) {
            return false
        }

        String release = releaseFile.text
        String osArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
        String jdkArch = (release.readLines().find { it.startsWith('OS_ARCH=') } ?: '').toLowerCase(Locale.ROOT)

        boolean hostIsX64 = osArch in ['amd64', 'x86_64']
        boolean jdkIsX64 = jdkArch.contains('x86_64') || jdkArch.contains('amd64')
        boolean hostIsArm64 = osArch in ['aarch64', 'arm64']
        boolean jdkIsArm64 = jdkArch.contains('aarch64') || jdkArch.contains('arm64')

        if ((hostIsX64 && !jdkIsX64) || (hostIsArm64 && !jdkIsArm64)) {
            logger.warn("Skipping Java runtime at ${candidate}; host architecture is ${osArch}, JDK metadata is ${jdkArch}.")
            return false
        }

        return true
    }

    if (selected == null) {
        return null
    }

    return selected
}

ext.preferredJavaHome = resolvePreferredJavaHome()
ext.preferredJavaIsJbr = false

if (preferredJavaHome != null) {
    File releaseFile = new File(preferredJavaHome, 'release')
    if (releaseFile.isFile()) {
        preferredJavaIsJbr = releaseFile.text.contains('IMPLEMENTOR="JetBrains')
    }
}

if (preferredJavaHome != null) {
    logger.lifecycle("Using Java runtime for dev tasks: ${preferredJavaHome}")
} else {
    logger.warn("No executable JBR/OpenJDK 25 runtime was found; Gradle Java 25 toolchains will be used.")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    if (propertyBool('generate_sources_jar')) {
        withSourcesJar()
    }
    if (propertyBool('generate_javadocs_jar')) {
        withJavadocJar()
    }
}

configurations {
    contain
    implementation.extendsFrom(contain)
    modCompileOnly
    compileOnly.extendsFrom(modCompileOnly)
    modRuntimeOnly
    runtimeOnly.extendsFrom(modRuntimeOnly)
}

String remapTaskName = propertyBool('enable_shadow') ? "remapShadowJar" : "remapJar"

unimined.minecraft {
    version "1.12.2"

    mappings {
        mcp("stable", "39-1.12")
    }

    forge {
        if (propertyBool('use_access_transformer')) {
            accessTransformer "${rootProject.projectDir}/src/main/resources/${propertyString('access_transformer_locations')}"
        }
        loader "14.23.5.2860"
        runs.all {
            if (rootProject.ext.preferredJavaHome != null) {
                doFirst {
                    executable = new File(rootProject.ext.preferredJavaHome, 'bin/java').absolutePath
                }
            }
            args += ['--username', minecraft_username]
            def extraArgs = propertyString('extra_jvm_args')
            if (extraArgs != null && !extraArgs.trim().isEmpty()) {
                jvmArgs += extraArgs.split { "\\s+" }.toList()
            }
            if (propertyBool('enable_foundation_debug')) {
                systemProperty("foundation.dump", "true")
                systemProperty("foundation.verbose", "true")
            }
            if (propertyBool('is_coremod')) {
                systemProperty("fml.coreMods.load", propertyString('coremod_plugin_class_name'))
            }
            def gpuOffload = propertyString('gpu_offload')
            if (gpuOffload != null && !gpuOffload.trim().isEmpty()) {
                switch (gpuOffload.trim().toLowerCase(Locale.ROOT)) {
                    case 'dri_prime':
                    case 'mesa':
                    case 'amd':
                        environment('DRI_PRIME', '1')
                        break
                    case 'nvidia':
                    case 'prime-run':
                        environment('DRI_PRIME', '1')
                        environment('__NV_PRIME_RENDER_OFFLOAD', '1')
                        environment('__GLX_VENDOR_LIBRARY_NAME', 'nvidia')
                        environment('__VK_LAYER_NV_optimus', 'NVIDIA_only')
                        break
                    default:
                        logger.warn("Unknown gpu_offload value '${gpuOffload}'. Use 'dri_prime' or 'nvidia'.")
                        break
                }
            }
            return
        }
    }

    defaultRemapJar = false
    
    String jarTaskName = propertyBool('enable_shadow') ? "shadowJar" : "jar"
    
    remap(tasks.named(jarTaskName).get()) {
        mixinRemap {
            enableBaseMixin()
            enableMixinExtra()
        }
    }

    mods {
        remap(configurations.modCompileOnly)
        remap(configurations.modRuntimeOnly)
    }
}

dependencies {
    if (propertyBool('enable_junit_testing')) {
        testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
        testImplementation 'org.ow2.asm:asm-tree:9.9'
        testImplementation 'net.minecraft:launchwrapper:1.12'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

apply from: 'gradle/scripts/dependencies.gradle'

processResources {
    rename '(.+_at.cfg)', 'META-INF/$1'
}

// Gradle's incremental Java output does not remove classes/resources whose source
// files were deleted. AUSM ships mixins, so a stale class can remain loadable and
// fail verification at game startup. Recreate main outputs for every packaged build.
tasks.named('compileJava').configure {
    outputs.upToDateWhen { false }
    doFirst {
        delete(layout.buildDirectory.dir('classes/java/main'))
    }
}

tasks.named('processResources').configure {
    outputs.upToDateWhen { false }
    doFirst {
        delete(layout.buildDirectory.dir('resources/main'))
    }
}

sourceSets {
    main {
        blossom {
            javaSources {
                property('mod_id', propertyString('mod_id'))
                property('mod_name', propertyString('mod_name'))
                property('mod_version', propertyString('mod_version'))
                property('package', "${root_package}.${mod_id}")
            }
            resources {
                property('mod_id', propertyString('mod_id'))
                property('mod_name', propertyString('mod_name'))
                property('mod_version', propertyString('mod_version'))
                property('mod_description', propertyString('mod_description'))
                property('mod_authors', propertyStringList('mod_authors', ',').collect {it.strip()}.join('", "'))
                property('mod_credits', propertyString('mod_credits'))
                property('mod_url', propertyString('mod_url'))
                property('mod_update_json', propertyString('mod_update_json'))
                property('mod_logo_path', propertyString('mod_logo_path'))
            }
        }
    }
}

idea {
    module {
        inheritOutputDirs = true
    }
    project {
        settings {
            runConfigurations {
                '1. Build'(Gradle) {
                    taskNames = ["build"]
                }
                '2. Run Client'(Gradle) {
                    taskNames = ["runClient"]
                }
                '3. Run Server'(Gradle) {
                    taskNames = ["runServer"]
                }
            }
            compiler.javac {
                afterEvaluate {
                    javacAdditionalOptions = '-encoding utf8'
                    moduleJavacAdditionalOptions = [
                            (project.name + '.main'): tasks.compileJava.options.compilerArgs.collect { '"' + it + '"' }.join(' ')
                    ]
                }
            }
        }
    }
}

if (!propertyBool('enable_shadow')) {
    shadowJar.enabled = false
}

compileJava {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_21
}

jar {
    archiveClassifier = 'dev'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'com/luna/ausm/impl/hotswap/**'
    if (!configurations.contain.isEmpty()) {
        into('/') {
            from configurations.contain
        }
    }
    doFirst {
        manifest {
            def attribute_map = [:]
            attribute_map['ModType'] = "CRL"
            attribute_map['MixinConfigs'] = "${mod_id}.default.mixin.json,${mod_id}.mod.mixin.json"
            if (!configurations.contain.isEmpty()) {
                attribute_map['ContainedDeps'] = configurations.contain.collect { it.name }.join(' ')
                attribute_map['NonModDeps'] = true
            }
            if (propertyBool('is_coremod')) {
                attribute_map['FMLCorePlugin'] = propertyString('coremod_plugin_class_name')
                if (propertyBool('coremod_includes_mod')) {
                    attribute_map['FMLCorePluginContainsFMLMod'] = true
                }
            }
            if (propertyBool('use_access_transformer')) {
                attribute_map['FMLAT'] = propertyString('access_transformer_locations')
            }
            attributes(attribute_map)
        }
    }
    finalizedBy(tasks.named(remapTaskName).get())
}

tasks.named(remapTaskName) {
    archiveFileName.set("AUSM-${project.version}-remapped.jar")
}

tasks.register('downgradeRemappedJar', xyz.wagyourtail.jvmdg.gradle.task.DowngradeJar) {
    dependsOn(tasks.named(remapTaskName))
    inputFile = tasks.named(remapTaskName).flatMap { it.archiveFile }
    classpath = sourceSets.main.compileClasspath
    downgradeTo = JavaVersion.VERSION_1_8
    archiveBaseName = 'AUSM'
    archiveVersion = project.version
    archiveClassifier = 'Java8-raw'
}

tasks.register('shadeRemappedDowngradedApi', xyz.wagyourtail.jvmdg.gradle.task.ShadeJar) {
    dependsOn(tasks.named('downgradeRemappedJar'))
    inputFile = tasks.named('downgradeRemappedJar').flatMap { it.archiveFile }
    downgradeTo = JavaVersion.VERSION_1_8
    archiveFileName = "AUSM-${project.version}-Java8.jar"
}

tasks.named('assemble') {
    dependsOn(tasks.named('shadeRemappedDowngradedApi'))
}


shadowJar {
    configurations = [project.configurations.shadow]
    archiveClassifier = "shadow"
}


tasks.named(remapTaskName).configure {
    doFirst {
        logging.captureStandardOutput LogLevel.INFO
    }
    doLast {
        logging.captureStandardOutput LogLevel.QUIET
    }
}

def meatballMinecraftDirectory = {
    String configuredDirectory = project.findProperty('meatball_minecraft_dir')?.toString()
    if (configuredDirectory == null || configuredDirectory.trim().isEmpty()) {
        configuredDirectory = System.getenv('MEATBALL_MINECRAFT_DIR')
    }
    if (configuredDirectory == null || configuredDirectory.trim().isEmpty()) {
        configuredDirectory = new File(
                System.getProperty('user.home'),
                '.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher/instances/MeatballCraft, Dimensional Ascension/minecraft'
        ).absolutePath
    }
    return file(configuredDirectory)
}

def meatballRtxGpuEnvironment = [
        'DRI_PRIME'                    : '1',
        '__NV_PRIME_RENDER_OFFLOAD'    : '1',
        '__GLX_VENDOR_LIBRARY_NAME'    : 'nvidia',
        '__VK_LAYER_NV_optimus'        : 'NVIDIA_only'
]

tasks.register('installMbcJar') {
    group = 'development'
    description = 'Builds the remapped AUSM JAR and atomically installs it as the sole AUSM archive in MeatballCraft.'
    dependsOn(tasks.named(remapTaskName))
    doLast {
        File minecraftDirectory = meatballMinecraftDirectory()
        File modsDirectory = new File(minecraftDirectory, 'mods')
        File sourceArchive = tasks.named(remapTaskName).get().archiveFile.get().asFile
        if (!sourceArchive.isFile()) {
            throw new GradleException("Missing remapped AUSM archive: ${sourceArchive}")
        }
        new java.util.zip.ZipFile(sourceArchive).close()
        Files.createDirectories(modsDirectory.toPath())

        File targetArchive = new File(modsDirectory, sourceArchive.name)
        java.nio.file.Path stagedArchive = Files.createTempFile(modsDirectory.toPath(), '.ausm-install-', '.jar')
        try {
            Files.copy(sourceArchive.toPath(), stagedArchive, StandardCopyOption.REPLACE_EXISTING)
            new java.util.zip.ZipFile(stagedArchive.toFile()).close()
            try {
                Files.move(stagedArchive, targetArchive.toPath(),
                        StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING)
            } catch (AtomicMoveNotSupportedException ignored) {
                Files.move(stagedArchive, targetArchive.toPath(), StandardCopyOption.REPLACE_EXISTING)
            }

            List<File> staleAusmArchives = (modsDirectory.listFiles() ?: []).findAll { archive ->
                archive.isFile() && archive.name ==~ /(?i)AUSM.*\.jar/ && archive != targetArchive
            }
            staleAusmArchives.each { archive ->
                Files.delete(archive.toPath())
            }

            List<File> installedAusmArchives = (modsDirectory.listFiles() ?: []).findAll { archive ->
                archive.isFile() && archive.name ==~ /(?i)AUSM.*\.jar/
            }
            if (installedAusmArchives.size() != 1 || installedAusmArchives.first().canonicalFile != targetArchive.canonicalFile) {
                throw new GradleException("Expected exactly one installed AUSM archive, found: ${installedAusmArchives}")
            }
            logger.lifecycle("Installed AUSM archive: ${targetArchive}")
        } catch (Exception error) {
            Files.deleteIfExists(stagedArchive)
            throw error
        }
    }
}

tasks.register('prepareMbcRtxGpu') {
    group = 'development'
    description = 'Prepares the MeatballCraft Prism profile to use the NVIDIA RTX GPU on its next launch.'
    doLast {
        File instanceConfig = new File(meatballMinecraftDirectory().parentFile, 'instance.cfg')
        if (!instanceConfig.isFile()) {
            throw new GradleException("Missing MeatballCraft instance configuration: ${instanceConfig}")
        }

        String instanceSettings = instanceConfig.getText('UTF-8')
        String wrapperCommand = '"env '.concat(
                meatballRtxGpuEnvironment.collect { name, value -> "${name}=${value}" }.join(' ')
        ).concat('"')
        Map<String, String> requiredGpuSettings = [
                'UseDiscreteGpu': 'true',
                'WrapperCommand' : wrapperCommand
        ]
        String preparedSettings = requiredGpuSettings.inject(instanceSettings) { settings, name, value ->
            settings.replaceAll('(?m)^' + java.util.regex.Pattern.quote(name) + '=.*(?:\\R|$)', '')
        }
        String gpuSettings = requiredGpuSettings.collect { name, value -> "${name}=${value}" }.join('\n') + '\n'
        int uiSectionIndex = preparedSettings.indexOf('\n[UI]')
        if (uiSectionIndex >= 0) {
            String settingsBeforeUi = preparedSettings.substring(0, uiSectionIndex)
            String uiAndFollowingSettings = preparedSettings.substring(uiSectionIndex + 1)
            preparedSettings = settingsBeforeUi.concat(settingsBeforeUi.endsWith('\n') ? '' : '\n')
                    .concat(gpuSettings)
                    .concat(uiAndFollowingSettings)
        } else {
            preparedSettings += (preparedSettings.endsWith('\n') ? '' : '\n') + gpuSettings
        }
        if (preparedSettings != instanceSettings) {
            Files.writeString(instanceConfig.toPath(), preparedSettings, java.nio.charset.StandardCharsets.UTF_8)
            logger.lifecycle("Prepared MeatballCraft profile for the NVIDIA RTX GPU: ${instanceConfig}")
        }
    }
}

tasks.register('prepareMbcSafeHotSwap') {
    group = 'development'
    description = 'Configures MeatballCraft debug launches to use only the AUSM class watcher, never JBR enhanced redefine or Mixin hot swap.'
    dependsOn(tasks.named('hotswapAgentJar'))
    doLast {
        File instanceConfig = new File(meatballMinecraftDirectory().parentFile, 'instance.cfg')
        if (!instanceConfig.isFile()) {
            throw new GradleException("Missing MeatballCraft instance configuration: ${instanceConfig}")
        }
        String settings = instanceConfig.getText('UTF-8')
        def matcher = (settings =~ /(?m)^JvmArgs=(.*)$/)
        if (!matcher.find()) {
            throw new GradleException("Missing JvmArgs setting: ${instanceConfig}")
        }
        String rawArgs = matcher.group(1).trim()
        String jvmArgs = rawArgs.startsWith('"') && rawArgs.endsWith('"')
                ? rawArgs.substring(1, rawArgs.length() - 1)
                : rawArgs
        jvmArgs = jvmArgs
                .replaceAll(/(?<!\S)-XX:\+AllowEnhancedClassRedefinition(?=\s|$)/, '')
                .replaceAll(/(?<!\S)-XX:HotswapAgent=\S+/, '')
                .replaceAll(/(?<!\S)-Dmixin\.hotSwap=true(?=\s|$)/, '')
                .replaceAll(/\s+/, ' ')
                .trim()
        List<String> requiredArgs = [
                '-javaagent:' + tasks.named('hotswapAgentJar').get().archiveFile.get().asFile.absolutePath,
                '-Dausm.hotswap.dir=' + layout.buildDirectory.dir('hotswap/classes').get().asFile.absolutePath,
                '-Dmixin.hotSwap=false',
                '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005'
        ]
        requiredArgs.each { argument ->
            if (!jvmArgs.contains(argument)) {
                jvmArgs = (jvmArgs + ' ' + argument).trim()
            }
        }
        String preparedSettings = settings.replaceFirst(/(?m)^JvmArgs=.*$/, 'JvmArgs="' + jvmArgs + '"')
        if (preparedSettings =~ /(?m)^OverrideJavaArgs=.*$/) {
            preparedSettings = preparedSettings.replaceFirst(/(?m)^OverrideJavaArgs=.*$/, 'OverrideJavaArgs=true')
        } else {
            preparedSettings += (preparedSettings.endsWith('\n') ? '' : '\n') + 'OverrideJavaArgs=true\n'
        }
        if (preparedSettings != settings) {
            Files.writeString(instanceConfig.toPath(), preparedSettings, java.nio.charset.StandardCharsets.UTF_8)
            logger.lifecycle("Prepared MeatballCraft safe AUSM hot swap profile: ${instanceConfig}")
        }
    }
}

tasks.named('installMbcJar').configure {
    mustRunAfter(tasks.named('prepareMbcRtxGpu'))
}

tasks.register('prepareSupersymmetryCleanroomHotSwap') {
    group = 'development'
    description = 'Keeps the Supersymmetry bootstrap on Java 8 and passes AUSM debug arguments to Cleanroom’s Java 25 relaunch.'
    dependsOn(tasks.named('hotswapAgentJar'))
    doLast {
        File minecraftDirectory = meatballMinecraftDirectory()
        File instanceConfig = new File(minecraftDirectory.parentFile, 'instance.cfg')
        File relauncherConfig = new File(minecraftDirectory, 'config/relauncher.json')
        if (!instanceConfig.isFile() || !relauncherConfig.isFile()) {
            throw new GradleException("Supersymmetry Cleanroom configuration is missing under: ${minecraftDirectory}")
        }

        List<String> debugArgs = [
                '-javaagent:' + tasks.named('hotswapAgentJar').get().archiveFile.get().asFile.absolutePath,
                '-Dausm.hotswap.dir=' + layout.buildDirectory.dir('hotswap/classes').get().asFile.absolutePath,
                '-Dmixin.hotSwap=false',
                '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005'
        ]
        String instanceSettings = instanceConfig.getText('UTF-8')
        def matcher = (instanceSettings =~ /(?m)^JvmArgs=(.*)$/)
        if (!matcher.find()) {
            throw new GradleException("Missing JvmArgs setting: ${instanceConfig}")
        }
        String bootstrapArgs = matcher.group(1).trim().replaceAll(/^"|"$/, '')
        debugArgs.each { argument -> bootstrapArgs = bootstrapArgs.replace(argument, '') }
        bootstrapArgs = bootstrapArgs.replaceAll(/\s+/, ' ').trim()
        String bootstrapJava = new File(new File(System.getProperty('user.home'), '.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher/java/jre-legacy'), 'bin/java').absolutePath
        String preparedInstanceSettings = instanceSettings
                .replaceFirst(/(?m)^JvmArgs=.*$/, 'JvmArgs="' + bootstrapArgs + '"')
                .replaceFirst(/(?m)^JavaPath=.*$/, 'JavaPath=' + bootstrapJava)
                .replaceFirst(/(?m)^JavaVersion=.*$/, 'JavaVersion=1.8.0_202')
                .replaceFirst(/(?m)^JavaVendor=.*$/, 'JavaVendor=Oracle Corporation')
        Files.writeString(instanceConfig.toPath(), preparedInstanceSettings, java.nio.charset.StandardCharsets.UTF_8)

        Map<String, Object> relauncherSettings = (Map<String, Object>) new JsonSlurper().parse(relauncherConfig)
        String relaunchArgs = (relauncherSettings.args ?: '').toString()
        debugArgs.each { argument -> relaunchArgs = relaunchArgs.replace(argument, '') }
        relaunchArgs = (relaunchArgs.replaceAll(/\s+/, ' ').trim() + ' ' + debugArgs.join(' ')).trim() + ' '
        relauncherSettings.targetJavaVersion = 25
        relauncherSettings.javaPath = new File(new File(System.getProperty('user.home'), '.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher/java/eclipse_temurin_jre25.0.3+9'), 'bin/java').absolutePath
        relauncherSettings.args = relaunchArgs
        Files.writeString(relauncherConfig.toPath(), JsonOutput.prettyPrint(JsonOutput.toJson(relauncherSettings)) + '\n', java.nio.charset.StandardCharsets.UTF_8)
        logger.lifecycle("Prepared Supersymmetry: Java 8 bootstrap -> Cleanroom Java 25 debug relaunch")
    }
}

tasks.register('launchMbcDebug', Exec) {
    group = 'development'
    description = 'Builds, installs, and launches MeatballCraft through Prism with JDWP on the NVIDIA RTX GPU.'
    dependsOn(tasks.named('prepareMbcRtxGpu'), tasks.named('prepareMbcSafeHotSwap'), tasks.named('installMbcJar'))
    workingDir(projectDir)
    environment(meatballRtxGpuEnvironment)
    List<String> prismCommand = ['flatpak', 'run']
    meatballRtxGpuEnvironment.each { name, value ->
        prismCommand.add("--env=${name}=${value}")
    }
    prismCommand.add('--env=AUSM_DEBUG_KEYBINDS=1')
    prismCommand.addAll([
            '--command=prismlauncher',
            'org.prismlauncher.PrismLauncher',
            '--show-window',
            '--launch',
            'MeatballCraft, Dimensional Ascension'
    ])
    commandLine(*prismCommand)
    doFirst {
        File instanceConfig = new File(meatballMinecraftDirectory().parentFile, 'instance.cfg')
        if (!instanceConfig.isFile()) {
            throw new GradleException("Missing MeatballCraft instance configuration: ${instanceConfig}")
        }
        String instanceSettings = instanceConfig.getText('UTF-8')
        List<String> requiredSettings = [
                'OverrideJavaArgs=true',
                '-javaagent:' + tasks.named('hotswapAgentJar').get().archiveFile.get().asFile.absolutePath,
                '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005',
                'UseDiscreteGpu=true'
        ]
        requiredSettings.addAll(meatballRtxGpuEnvironment.collect { name, value -> "${name}=${value}" })
        List<String> missingSettings = requiredSettings.findAll { setting -> !instanceSettings.contains(setting) }
        if (!missingSettings.isEmpty()) {
            throw new GradleException("MeatballCraft debug launch is missing required instance settings ${missingSettings}: ${instanceConfig}")
        }
    }
}

tasks.register('launchSupersymmetryDebug', Exec) {
    group = 'development'
    description = 'Builds, installs, and launches Supersymmetry through Prism with the AUSM watcher and JDWP.'
    dependsOn {
        String configuredDirectory = project.findProperty('meatball_minecraft_dir')?.toString()?.trim()
        if (configuredDirectory == null || configuredDirectory.isEmpty()) {
            throw new GradleException('launchSupersymmetryDebug requires -Pmeatball_minecraft_dir=<Supersymmetry minecraft directory>.')
        }
        [tasks.named('prepareMbcRtxGpu'), tasks.named('prepareSupersymmetryCleanroomHotSwap'), tasks.named('installMbcJar')]
    }
    workingDir(projectDir)
    environment(meatballRtxGpuEnvironment)
    List<String> prismCommand = ['flatpak', 'run']
    meatballRtxGpuEnvironment.each { name, value ->
        prismCommand.add("--env=${name}=${value}")
    }
    prismCommand.add('--env=AUSM_DEBUG_KEYBINDS=1')
    prismCommand.addAll([
            '--command=prismlauncher',
            'org.prismlauncher.PrismLauncher',
            '--show-window',
            '--launch',
            'Supersymmetry'
    ])
    commandLine(*prismCommand)
    doFirst {
        File minecraftDirectory = meatballMinecraftDirectory()
        if (minecraftDirectory.parentFile?.name != 'Supersymmetry') {
            throw new GradleException("launchSupersymmetryDebug only accepts the Supersymmetry profile, got: ${minecraftDirectory}")
        }
        String instanceSettings = new File(minecraftDirectory.parentFile, 'instance.cfg').getText('UTF-8')
        String relauncherSettings = new File(minecraftDirectory, 'config/relauncher.json').getText('UTF-8')
        List<String> requiredSettings = [
                'AutomaticJava=false',
                'JavaVersion=1.8.',
                'JavaPath=' + new File(new File(System.getProperty('user.home'), '.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher/java/jre-legacy'), 'bin/java').absolutePath,
                '"targetJavaVersion": 25',
                '-javaagent:' + tasks.named('hotswapAgentJar').get().archiveFile.get().asFile.absolutePath,
                '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005'
        ]
        List<String> missingSettings = requiredSettings.findAll { setting -> !(instanceSettings + relauncherSettings).contains(setting) }
        if (!missingSettings.isEmpty()) {
            throw new GradleException("Supersymmetry debug launch is missing required instance settings ${missingSettings}")
        }
    }
}

tasks.register('stageHotSwapClasses') {
    group = 'development'
    description = 'Builds and stages production-remapped AUSM classes for the live class watcher.'
    dependsOn(tasks.named(remapTaskName))
    doLast {
        Set<String> requestedClassFiles = providers.gradleProperty('hotswapClasses')
                .getOrElse('')
                .split(',')
                .collect { it.trim() }
                .findAll { !it.isEmpty() }
                .collect { it.replace('.', '/') + '.class' }
                .toSet()
        boolean includeMixins = providers.gradleProperty('hotswapIncludeMixins')
                .map { Boolean.parseBoolean(it) }
                .getOrElse(false)
        File destinationRoot = layout.buildDirectory.dir('hotswap/classes').get().asFile
        Files.createDirectories(destinationRoot.toPath())
        File archive = tasks.named(remapTaskName).get().archiveFile.get().asFile
        zipTree(archive).matching {
            include 'com/luna/ausm/**/*.class'
            exclude 'com/luna/ausm/impl/hotswap/**'
        }.visit { details ->
            if (details.directory) {
                return
            }
            String classFile = details.relativePath.pathString
            if (!requestedClassFiles.isEmpty() && !requestedClassFiles.contains(classFile)) {
                return
            }
            // MixinAgent retransforms target classes, so an unrelated pending
            // mixin can destabilize a perfectly ordinary renderer reload.
            // Keep mixin reapplication explicit instead of bundling it into
            // every broad staging run.
            if (!includeMixins && classFile.contains('/mixin/')) {
                return
            }
            File destination = new File(destinationRoot, details.relativePath.pathString)
            byte[] bytecode = Files.readAllBytes(details.file.toPath())
            if (destination.isFile() && java.util.Arrays.equals(bytecode, Files.readAllBytes(destination.toPath()))) {
                return
            }
            Files.createDirectories(destination.parentFile.toPath())
            File temporary = new File(destination.parentFile, ".${destination.name}.ausm-stage")
            Files.write(temporary.toPath(), bytecode)
            try {
                Files.move(temporary.toPath(), destination.toPath(),
                        StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING)
            } catch (AtomicMoveNotSupportedException ignored) {
                Files.move(temporary.toPath(), destination.toPath(), StandardCopyOption.REPLACE_EXISTING)
            }
        }
    }
}

tasks.register('safeMbcHotSwap') {
    group = 'development'
    description = 'Compiles, remaps, and stages changed AUSM classes for the running MeatballCraft custom class watcher. Do not use IntelliJ Reload Changed Classes.'
    dependsOn(tasks.named('stageHotSwapClasses'))
