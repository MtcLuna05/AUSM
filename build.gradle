        if (targetPid.isEmpty() || targetClasses.isEmpty()) {
            throw new GradleException('Pass -PhotswapPid=<pid> and -PhotswapClass=<binary-name[,binary-name...]>')
        }
        File agentArchive = tasks.named('hotswapAgentJar').get().archiveFile.get().asFile
