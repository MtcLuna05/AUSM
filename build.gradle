tasks.register('hotswapAgentJar', Jar) {
    group = 'development'
    description = 'Builds the isolated premain agent without exposing AUSM mod classes to the system class loader.'
    dependsOn(tasks.named('classes'))
    archiveClassifier = 'hotswap-agent'
    from(sourceSets.main.output) {
        include 'com/luna/ausm/impl/hotswap/**'
    }
    manifest {
        attributes(
                'Premain-Class': 'com.luna.ausm.impl.hotswap.AusmHotSwapAgent',
                'Agent-Class': 'com.luna.ausm.impl.hotswap.DirectClassRedefinitionAgent',
                'Can-Redefine-Classes': true
        )
    }
}

tasks.register('injectHotSwapClass', JavaExec) {
    group = 'development'
    description = 'Attaches the AUSM agent and directly redefines named staged game classes.'
    dependsOn(tasks.named('hotswapAgentJar'))
    mainClass = 'com.luna.ausm.impl.hotswap.DynamicAgentAttacher'
    classpath = files(tasks.named('hotswapAgentJar').flatMap { it.archiveFile })
    jvmArgs '--add-modules', 'jdk.attach'
    doFirst {
        String targetPid = providers.gradleProperty('hotswapPid').getOrElse('').trim()
        String targetClasses = providers.gradleProperty('hotswapClass').getOrElse('').trim()
        if (targetPid.isEmpty() || targetClasses.isEmpty()) {
            throw new GradleException('Pass -PhotswapPid=<pid> and -PhotswapClass=<binary-name[,binary-name...]>')
        }
        File agentArchive = tasks.named('hotswapAgentJar').get().archiveFile.get().asFile
        setArgs([targetPid, agentArchive.absolutePath, targetClasses])
    }
}

tasks.register('injectHotSwapNewClass', JavaExec) {
    group = 'development'
    description = 'Attaches the AUSM agent and defines staged support classes in every active AUSM class loader.'
    dependsOn(tasks.named('hotswapAgentJar'))
    mainClass = 'com.luna.ausm.impl.hotswap.DynamicAgentAttacher'
    classpath = files(tasks.named('hotswapAgentJar').flatMap { it.archiveFile })
    jvmArgs '--add-modules', 'jdk.attach'
    doFirst {
        String targetPid = providers.gradleProperty('hotswapPid').getOrElse('').trim()
