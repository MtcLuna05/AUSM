}

tasks.register('rollbackHotSwap', JavaExec) {
    group = 'development'
    description = 'Attaches to the running JVM and restores the bytecode preceding the last live batch.'
    dependsOn(tasks.named('hotswapAgentJar'))
    mainClass = 'com.luna.ausm.impl.hotswap.DynamicAgentAttacher'
    classpath = files(tasks.named('hotswapAgentJar').flatMap { it.archiveFile })
    jvmArgs '--add-modules', 'jdk.attach'
    doFirst {
        String targetPid = providers.gradleProperty('hotswapPid').getOrElse('').trim()
        if (targetPid.isEmpty()) {
            throw new GradleException('Pass -PhotswapPid=<pid>')
        }
        File agentArchive = tasks.named('hotswapAgentJar').get().archiveFile.get().asFile
        setArgs([targetPid, agentArchive.absolutePath, '@rollback'])
    }
}

