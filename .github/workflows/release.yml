name: Releases

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor == 'MtcLuna05'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.5.1
        name: Set up Gradle
      - name: Add permission
        run: chmod +x ./gradlew
      - name: Execute Gradle build
        run: ./gradlew build

      - uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: "build/libs/*"
          allowUpdates: false
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
          tag: ${{ inputs.tag }}
          commit: ${{ inputs.tag }}
