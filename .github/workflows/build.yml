name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jar:
    name: Build jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon build

      - name: Stage jar
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n 1)"
          mod_id="$(sed -n 's/^mod_id[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n 1)"
          short_sha="${GITHUB_SHA::7}"
          mkdir -p dist
          jar_path="$(find build/libs -maxdepth 1 -type f -name "${mod_id}-*.jar" ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' | sort | tail -n 1)"
          if [[ -z "${jar_path}" ]]; then
            jar_path="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' | sort | tail -n 1)"
          fi
          if [[ -z "${jar_path}" ]]; then
            echo "No distributable AUSM jar found in build/libs" >&2
            find build/libs -maxdepth 1 -type f -print >&2 || true
            exit 1
          fi
          cp "${jar_path}" "dist/AUSM-${version}+${short_sha}.jar"
          cp "${jar_path}" "dist/AUSM-latest.jar"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUSM-${{ github.sha }}
          path: dist/*.jar
          if-no-files-found: error

  latest-release:
    name: Publish latest release
    needs: jar
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.actor == 'MtcLuna05'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon build

      - name: Stage jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mod_id="$(sed -n 's/^mod_id[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n 1)"
          jar_path="$(find build/libs -maxdepth 1 -type f -name "${mod_id}-*.jar" ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' | sort | tail -n 1)"
          if [[ -z "${jar_path}" ]]; then
            jar_path="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' | sort | tail -n 1)"
          fi
          if [[ -z "${jar_path}" ]]; then
            echo "No distributable AUSM jar found in build/libs" >&2
            exit 1
          fi
          cp "${jar_path}" "dist/AUSM-latest.jar"

      - name: Publish latest release jar
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" 2>/dev/null || true
          gh release create latest dist/AUSM-latest.jar \
            --title "AUSM Latest Build" \
            --notes "Manual latest jar from commit ${GITHUB_SHA}." \
            --prerelease \
            --target "${GITHUB_SHA}"
