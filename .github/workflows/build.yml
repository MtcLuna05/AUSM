name: Build

on:
  push:
    branches:
      - java-8
  pull_request:
    branches:
      - java-8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jar:
    name: Build jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew --no-daemon assemble

      - name: Stage jar
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n 1)"
          jar_name="AUSM-${version}-Java25.jar"
          jar_path="build/libs/${jar_name}"
          mkdir -p dist
          if [[ ! -f "${jar_path}" ]]; then
            echo "Expected distributable AUSM jar not found: ${jar_path}" >&2
            find build/libs -maxdepth 1 -type f -print >&2 || true
            exit 1
          fi
          cp "${jar_path}" "dist/${jar_name}"
          cp "${jar_path}" "dist/AUSM-latest.jar"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUSM-${{ github.sha }}
          path: dist/*.jar
          if-no-files-found: error

  build-release:
    name: Publish build release
    needs: jar
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.actor == 'MtcLuna05')
    permissions:
      contents: write

    steps:
      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: AUSM-${{ github.sha }}
          path: dist

      - name: Publish versioned release jar
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/AUSM-latest.jar
          version="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n 1)"
          short_sha="${GITHUB_SHA::7}"
          versioned_jar="dist/AUSM-${version}-Java25.jar"
          if [[ ! -f "${versioned_jar}" ]]; then
            echo "Expected release AUSM jar not found: ${versioned_jar}" >&2
            find dist -maxdepth 1 -type f -print >&2 || true
            exit 1
          fi
          release_tag="v${version}+${short_sha}"
          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" "${versioned_jar}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${release_tag}" "${versioned_jar}" --repo "${GITHUB_REPOSITORY}" \
              --title "AUSM ${version} (${short_sha})" \
              --notes "Build from commit ${GITHUB_SHA}." \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi
