name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jar:
    name: Build jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon build

      - name: Stage jar
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n 1)"
          mod_id="$(sed -n 's/^mod_id[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n 1)"
          short_sha="${GITHUB_SHA::7}"
          mkdir -p dist
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'AUSM-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' | sort | tail -n 1)"
          if [[ -z "${jar_path}" && -n "${mod_id}" ]]; then
            jar_path="$(find build/libs -maxdepth 1 -type f -name "${mod_id}-*.jar" ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' | sort | tail -n 1)"
          fi
          if [[ -z "${jar_path}" ]]; then
            jar_path="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' | sort | tail -n 1)"
          fi
          if [[ -z "${jar_path}" ]]; then
            echo "No distributable AUSM jar found in build/libs" >&2
            find build/libs -maxdepth 1 -type f -print >&2 || true
            exit 1
          fi
          cp "${jar_path}" "dist/AUSM-${version}+${short_sha}.jar"
          cp "${jar_path}" "dist/AUSM-latest.jar"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUSM-${{ github.sha }}
          path: dist/*.jar
          if-no-files-found: error

  build-release:
    name: Publish build release
    needs: jar
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.actor == 'MtcLuna05')
    permissions:
      contents: write

    steps:
      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: AUSM-${{ github.sha }}
          path: dist

      - name: Publish versioned release jar
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/AUSM-latest.jar
          short_sha="${GITHUB_SHA::7}"
          versioned_jar="$(find dist -maxdepth 1 -type f -name "AUSM-*+${short_sha}.jar" | sort | tail -n 1)"
          if [[ -z "${versioned_jar}" ]]; then
            echo "No versioned AUSM jar found in dist" >&2
            find dist -maxdepth 1 -type f -print >&2 || true
            exit 1
          fi
          version="$(basename "${versioned_jar}")"
          version="${version#AUSM-}"
          version="${version%+${short_sha}.jar}"
          release_tag="v${version}+${short_sha}"
          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" "${versioned_jar}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${release_tag}" "${versioned_jar}" --repo "${GITHUB_REPOSITORY}" \
              --title "AUSM ${version} (${short_sha})" \
              --notes "Build from commit ${GITHUB_SHA}." \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi
