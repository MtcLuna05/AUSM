name: Releases to CurseForge and/or Modrinth

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor == 'MtcLuna05'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.5.1
        name: Set up Gradle

      - name: Add permission
        run: chmod +x ./gradlew

      - name: Execute Gradle build
        run: ./gradlew build

      - name: Read player changelog
        id: changelog
        shell: bash
        run: |
          {
            echo 'player<<EOF'
            bash scripts/extract-changelog.sh --player
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          modrinth-id: placeholder
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: placeholder
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: |
            build/libs/AUSM-*-Java25.jar
          loaders: forge
          game-versions: 1.12.2
          java: |
            25
          version: ${{ inputs.tag }}
          changelog: ${{ steps.changelog.outputs.player }}
